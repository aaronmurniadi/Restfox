name: Publish Web Releases

on:
  workflow_dispatch:
    inputs:
      job-to-run:
        description: "Job to run (leave empty to run all)"
        required: false
        default: ""
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_VERSION: 26

jobs:
  publish-chrome-extension:
    # Google admits the store sign-in only for a v tag, so a manual run on a branch skips this job
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || github.event.inputs.job-to-run == 'publish-chrome-extension' || github.event.inputs.job-to-run == '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build UI
        working-directory: ./packages/ui
        run: |
          npm ci
          npm run build-extension
      - name: Zip the extension app
        working-directory: ./packages/browser-extension/v3-app
        run: npm run zip
      - name: Keep the zip with the run
        uses: actions/upload-artifact@v7
        with:
          name: restfox-extension-app
          path: packages/browser-extension/v3-app/src.zip
      # Google only lets main.yml sign in for a v tag of this repository, see AGENTS.md
      - name: Sign in to Google as the store service account
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/564579398954/locations/global/workloadIdentityPools/github/providers/restfox-repo
          service_account: restfox-release@chrome-web-store-api-access.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload to the Chrome Web Store
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          ITEM_URL: https://chromewebstore.googleapis.com/v2/publishers/c9838cf7-7295-4639-8a19-3ebf3ff634dd/items/fihmegnabgglklkppphibngblkomlhcn
          UPLOAD_URL: https://chromewebstore.googleapis.com/upload/v2/publishers/c9838cf7-7295-4639-8a19-3ebf3ff634dd/items/fihmegnabgglklkppphibngblkomlhcn
        run: |
          response=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $TOKEN" -T packages/browser-extension/v3-app/src.zip "$UPLOAD_URL:upload") || { echo "$response"; exit 1; }
          echo "$response"
          state=$(echo "$response" | jq -r '.uploadState')
          for attempt in $(seq 1 30); do
            [ "$state" != "IN_PROGRESS" ] && break
            sleep 10
            response=$(curl --fail-with-body -sS -H "Authorization: Bearer $TOKEN" "$ITEM_URL:fetchStatus") || { echo "$response"; exit 1; }
            echo "$response"
            state=$(echo "$response" | jq -r '.lastAsyncUploadState')
          done
          [ "$state" = "SUCCEEDED" ] || { echo "Upload did not succeed: $state"; exit 1; }
      # Google reviews the upload and, once approved, holds it until the user clicks Publish in the store dashboard
      - name: Submit for review
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          ITEM_URL: https://chromewebstore.googleapis.com/v2/publishers/c9838cf7-7295-4639-8a19-3ebf3ff634dd/items/fihmegnabgglklkppphibngblkomlhcn
        run: |
          response=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"publishType": "STAGED_PUBLISH"}' "$ITEM_URL:publish") || { echo "$response"; exit 1; }
          echo "$response"
          state=$(echo "$response" | jq -r '.state')
          [ "$state" = "PENDING_REVIEW" ] || [ "$state" = "STAGED" ] || { echo "Submission was not accepted: $state"; exit 1; }
  build-docker-image:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job-to-run == 'build-docker-image' || github.event.inputs.job-to-run == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Build and tag docker image
        working-directory: .
        run: |
          docker build -t flawiddsouza/restfox:${{ env.VERSION }} -t flawiddsouza/restfox:latest .
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish docker image
        run: |
          docker push --all-tags flawiddsouza/restfox
  update-release-notes:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job-to-run == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate & Update Release Notes
        run: |
          node scripts/update-release-notes.js
